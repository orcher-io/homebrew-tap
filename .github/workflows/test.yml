name: test

# Installs the formula from this checkout and runs the installed binary, on every
# platform it ships for, whenever it changes. A formula with a wrong URL or
# checksum fails here instead of on a user's machine.

on:
  push:
    branches: [main]
    paths: ["Formula/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["Formula/**", ".github/workflows/test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the formulae
        id: formulae
        run: |
          set -euo pipefail
          names=$(find Formula -name '*.rb' -exec basename {} .rb \; | sort | tr '\n' ' ')
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "formulae: ${names:-none}"

      - name: Set up Homebrew
        if: steps.formulae.outputs.names != '' && runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install and test from this checkout
        if: steps.formulae.outputs.names != ''
        run: |
          set -euo pipefail
          tap="$(brew --repository)/Library/Taps/orcher-io/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          rm -rf "$tap"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          for f in ${{ steps.formulae.outputs.names }}; do
            brew install "orcher-io/tap/$f"
            "$(brew --prefix)/bin/$f" --version
          done
